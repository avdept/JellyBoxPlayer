name: Android Release

# Called by the Release workflow, which creates the release and passes the
# version and the tag to attach the universal APK to. Can also be dispatched on
# its own to rebuild or backfill the APK.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      release_tag:
        description: Existing release (draft or published) to attach the APK to
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach the APK to: a tag, "latest", or blank to only build'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
      PLAY_TRACK: ${{ vars.PLAY_TRACK }}
      ANDROID_KEYSTORE_ENV_VAR: ${{ secrets.ANDROID_KEYSTORE_ENV_VAR }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      # fastlane reads BUILD_VERSION/BUILD_NUMBER; both are left unset on a
      # standalone dispatch so it falls back to the pubspec values.
      - name: Resolve version
        working-directory: .
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            echo "BUILD_VERSION=$IN_VERSION" >> "$GITHUB_ENV"
          fi
          if [ -n "$IN_BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER=$IN_BUILD_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Private UPnP quirks
        uses: ./.github/actions/private-quirks
        with:
          deploy-key: ${{ secrets.UPNP_QUIRKS_DEPLOY_KEY }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Build universal APK and upload bundle to Play as draft
        run: bundle exec fastlane android beta

      - name: Archive app bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: ./.github/actions/release-assets
        with:
          release-tag: ${{ inputs.release_tag }}
          files: build/app/outputs/universal/jellybox-universal.apk
          token: ${{ secrets.GITHUB_TOKEN }}
