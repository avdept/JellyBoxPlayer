name: jellybox
on: [push, workflow_dispatch]
jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check the tree builds without the private packages
        run: ./tool/check_public_pubspec.sh

      - name: Private packages
        uses: ./.github/actions/private-quirks
        with:
          deploy-key: ${{ secrets.UPNP_QUIRKS_DEPLOY_KEY }}
          genre-playlists-deploy-key: ${{ secrets.GENRE_PLAYLISTS_DEPLOY_KEY }}

      - name: App tests against the real packages
        run: flutter test

      - name: upnp_quirks package tests
        working-directory: packages/upnp_quirks
        run: |
          dart pub get
          dart test

      - name: genre_playlists package tests
        working-directory: packages/genre_playlists
        run: |
          dart pub get
          dart test
