name: jellybox
on: [push, workflow_dispatch]
jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check the tree builds without the private package
        run: ./tool/check_public_pubspec.sh

      - name: Private package
        uses: ./.github/actions/optional-features
        with:
          deploy-key: ${{ secrets.OPTIONAL_FEATURES_DEPLOY_KEY }}

      - name: App tests against the real package
        run: flutter test

      - name: optional_features package tests
        working-directory: packages/optional_features
        run: |
          dart pub get
          dart test
