name: Windows Release

# Called by the Release workflow, which creates the release and passes the
# version and the tag to attach assets to. Can also be dispatched on its own to
# rebuild or backfill Windows artifacts.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      release_tag:
        description: Existing release (draft or published) to attach assets to
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach assets to: a tag, "latest", or blank to only build'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # windows-latest ships Inno Setup 6.x, but jellybox.iss needs 7's
      # SetupArchitecture directive. Pinned for reproducible installers.
      INNO_VERSION: '7.0.2'

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            VERSION="$IN_VERSION"
            BUILD_NUMBER="${IN_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          else
            # Standalone dispatch: fall back to the pubspec version.
            VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Private UPnP quirks
        uses: ./.github/actions/private-quirks
        with:
          deploy-key: ${{ secrets.UPNP_QUIRKS_DEPLOY_KEY }}

      # smtc_windows compiles a Rust crate through cargokit, which only ever
      # looks for an existing rustup on PATH or in ~/.cargo/bin and fails the
      # build rather than bootstrapping one. windows-latest happens to ship
      # Rust today; this pins it instead of depending on the image.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Windows app
        run: |
          flutter pub get
          flutter build windows --release `
            --build-name=${{ steps.version.outputs.version }} `
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Stage runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build\windows\x64\runner\Release'
          # Guards against the runner silently producing a differently named
          # binary (the executable is set by BINARY_NAME in windows/CMakeLists.txt).
          if (-not (Test-Path "$release\jellybox.exe")) {
            Get-ChildItem $release
            throw "jellybox.exe not found in $release"
          }

          # Both the zip and the installer ship this staged copy. .lib/.exp are
          # linker byproducts that the app never loads, so they are dropped.
          $staging = Join-Path $env:RUNNER_TEMP 'jellybox-win-x64'
          if (Test-Path $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
          Copy-Item $release $staging -Recurse
          $junk = @(Get-ChildItem $staging -Include '*.lib','*.exp' -Recurse)
          foreach ($f in $junk) { Remove-Item -LiteralPath $f.FullName -Force }
          Write-Host "Staged $(@(Get-ChildItem $staging -Recurse -File).Count) files, dropped $($junk.Count) linker byproducts"
          "STAGING_DIR=$staging" >> $env:GITHUB_ENV

      - name: Create portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Entry names are written explicitly with '/' separators. Both
          # Compress-Archive and ZipFile::CreateFromDirectory emit '\' on .NET
          # Framework, which violates the ZIP spec and makes strict extractors
          # (and anything non-Windows) treat the paths as flat filenames.
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $PWD 'windows-portable.zip'
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          $root = (Resolve-Path $env:STAGING_DIR).Path.TrimEnd('\') + '\'
          $archive = [System.IO.Compression.ZipFile]::Open($zip, 'Create')
          try {
            foreach ($file in Get-ChildItem -LiteralPath $env:STAGING_DIR -Recurse -File) {
              $name = $file.FullName.Substring($root.Length).Replace('\', '/')
              [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive, $file.FullName, $name,
                [System.IO.Compression.CompressionLevel]::Optimal)
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Archive size: $([math]::Round((Get-Item $zip).Length/1MB,1)) MB"

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # jellybox.iss requires Inno Setup 7 (SetupArchitecture=x64), while the
          # runner image ships 6.x — so ISCC is resolved against 7's install
          # locations only, and 7 is installed from jrsoftware's own signed
          # GitHub release if it isn't already there. Deliberately not `choco
          # install innosetup`, which tracks whatever major version it packages.
          function Resolve-Iscc {
            @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          $iscc = Resolve-Iscc
          if (-not $iscc) {
            $ver = $env:INNO_VERSION
            $url = "https://github.com/jrsoftware/issrc/releases/download/is-$($ver -replace '\.','_')/innosetup-$ver-x64.exe"
            $dl = Join-Path $env:RUNNER_TEMP 'innosetup-x64.exe'
            Write-Host "Inno Setup 7 not present; installing $ver from $url"
            Invoke-WebRequest -Uri $url -OutFile $dl
            Start-Process $dl -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -NoNewWindow
            $iscc = Resolve-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup 7 compiler (ISCC.exe) not found after install.' }
          Write-Host "Using $iscc"

          $out = Join-Path $PWD 'installer-out'
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DAppSourceDir=$env:STAGING_DIR" `
            "/DAppOutputDir=$out" `
            'windows\installer\jellybox.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

          # The name is fixed by OutputBaseFilename in jellybox.iss rather than
          # discovered, so that renaming it there fails the build loudly instead
          # of silently breaking the stable /releases/latest/download/ URL.
          $setup = Join-Path $out 'windows-setup.exe'
          if (-not (Test-Path $setup)) {
            Get-ChildItem $out
            throw 'Expected windows-setup.exe (check OutputBaseFilename in windows/installer/jellybox.iss)'
          }
          Write-Host "Installer: windows-setup.exe ($([math]::Round((Get-Item $setup).Length/1MB,1)) MB)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellybox-windows-x64
          path: |
            windows-portable.zip
            installer-out/windows-setup.exe

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: ./.github/actions/release-assets
        with:
          release-tag: ${{ inputs.release_tag }}
          files: |
            windows-portable.zip
            installer-out/windows-setup.exe
          token: ${{ secrets.GITHUB_TOKEN }}
