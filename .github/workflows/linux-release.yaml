name: Linux Release

# Called by the Release workflow, which creates the release and passes the
# version and the tag to attach assets to. Can also be dispatched on its own to
# rebuild or backfill Linux artifacts.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      release_tag:
        description: Existing release (draft or published) to attach assets to
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach assets to: a tag, "latest", or blank to only build'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # Resolved once and shared by every build leg so the matrix can't disagree
  # with itself about the version it is stamping.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            VERSION="$IN_VERSION"
            BUILD_NUMBER="${IN_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          else
            # Standalone dispatch: fall back to pubspec.yaml.
            SOURCE="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
            VERSION="${SOURCE%+*}"
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` is the Flutter build output directory (build/linux/<arch>);
          # the rest are the per-packager spellings of the same machine.
          #
          # The runner is the oldest Ubuntu LTS GitHub still offers, on purpose:
          # bundle-libs.sh copies the host's GTK/glib/libstdc++ into the bundle,
          # and those carry the host's glibc symbol versions with them. Built on
          # 24.04 the AppImage needed GLIBC_2.38 and refused to start on 22.04
          # (the AppImage catalog tests on exactly that release); built on 22.04
          # it runs on everything with glibc >= 2.35.
          - runner: ubuntu-22.04
            arch: x64
            appimage_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
            appimage_arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable

      - name: Private package
        uses: ./.github/actions/optional-features
        with:
          deploy-key: ${{ secrets.OPTIONAL_FEATURES_DEPLOY_KEY }}

      # flutter-action installs from releases_linux.json, which only ever
      # contains x64 archives — there is no Linux arm64 Flutter SDK tarball to
      # download. The engine *does* publish linux-arm64 artifacts, so on arm we
      # clone the SDK at the stable tag and let precache fetch them.
      - name: Install Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch stable \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv libasound2-dev \
            libsecret-1-dev libjsoncpp-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            patchelf rpm ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Build Linux bundle
        run: |
          flutter --version
          flutter precache --linux
          flutter pub get
          flutter build linux --release \
            --dart-define=JELLYBOX_SIDELOAD=true \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Bundle shared libraries
        run: ./linux/packaging/bundle-libs.sh build/linux/${{ matrix.arch }}/release/bundle

      - name: Create archive
        run: |
          cd build/linux/${{ matrix.arch }}/release/bundle
          tar czf "$GITHUB_WORKSPACE/jellybox-linux-${{ matrix.arch }}.tar.gz" .

      # Named after the app, not the platform: the AppImage catalog rejects
      # "linux" in the file name (every AppImage is for Linux). Unversioned so
      # the website's releases/latest/download links keep resolving.
      - name: Build AppImage
        run: |
          ./linux/packaging/make-appimage.sh \
            build/linux/${{ matrix.arch }}/release/bundle \
            "$GITHUB_WORKSPACE/JellyBox-${{ matrix.appimage_arch }}.AppImage" \
            "${{ needs.version.outputs.version }}"

      - name: Build .deb package
        run: |
          ./linux/packaging/make-deb.sh \
            build/linux/${{ matrix.arch }}/release/bundle \
            "$GITHUB_WORKSPACE/jellybox-linux-${{ matrix.deb_arch }}.deb" \
            "${{ needs.version.outputs.version }}" \
            "${{ needs.version.outputs.build_number }}"

      - name: Build .rpm package
        run: |
          ./linux/packaging/make-rpm.sh \
            build/linux/${{ matrix.arch }}/release/bundle \
            "$GITHUB_WORKSPACE/jellybox-linux-${{ matrix.rpm_arch }}.rpm" \
            "${{ needs.version.outputs.version }}" \
            "${{ needs.version.outputs.build_number }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellybox-linux-${{ matrix.arch }}
          path: |
            jellybox-linux-${{ matrix.arch }}.tar.gz
            JellyBox-${{ matrix.appimage_arch }}.AppImage
            jellybox-linux-${{ matrix.deb_arch }}.deb
            jellybox-linux-${{ matrix.rpm_arch }}.rpm

  # Wraps each leg's tarball into a .flatpak. Runs inside the Flathub builder
  # image, which already has flatpak-builder and the freedesktop runtime.
  flatpak:
    needs: [version, build]

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            flatpak_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            flatpak_arch: aarch64

    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jellybox-linux-${{ matrix.arch }}
          path: dist

      - name: Stage bundle
        run: |
          mkdir -p bundle
          tar xzf dist/jellybox-linux-${{ matrix.arch }}.tar.gz -C bundle
          ./linux/packaging/flatpak/stage.sh bundle "${{ needs.version.outputs.version }}"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: linux/packaging/flatpak/com.prodigytech.jellybox.yml
          bundle: jellybox-linux-${{ matrix.flatpak_arch }}.flatpak
          arch: ${{ matrix.flatpak_arch }}
          cache: false
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: jellybox-linux-flatpak-${{ matrix.arch }}
          path: jellybox-linux-${{ matrix.flatpak_arch }}.flatpak

  # Publishing is its own job so the build legs never race to upload the same
  # release assets. The `jellybox-linux-*` pattern picks up both the packages
  # and the .flatpak files.
  release:
    needs: [build, flatpak]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jellybox-linux-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist

      - name: Attach to release
        uses: ./.github/actions/release-assets
        with:
          release-tag: ${{ inputs.release_tag }}
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
