name: Linux Release

on:
  workflow_dispatch:
    inputs:
      publish_to_latest:
        description: 'Attach the build to the latest existing release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Resolved once and shared by every build leg so the matrix can't disagree
  # with itself about the version it is stamping.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SOURCE="${GITHUB_REF#refs/tags/v}"
          else
            # Manual run not against a tag (e.g. dispatched from a branch to
            # backfill Linux artifacts): fall back to pubspec.yaml so VERSION
            # never ends up being a branch ref like "heads/linux-builds".
            SOURCE="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          fi
          VERSION="${SOURCE%+*}"
          BUILD_NUMBER="${SOURCE#*+}"
          if [ "$BUILD_NUMBER" = "$SOURCE" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` is the Flutter build output directory (build/linux/<arch>);
          # the rest are the per-packager spellings of the same machine.
          - runner: ubuntu-24.04
            arch: x64
            appimage_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable

      - name: Private UPnP quirks
        uses: ./.github/actions/private-quirks
        with:
          deploy-key: ${{ secrets.UPNP_QUIRKS_DEPLOY_KEY }}

      # flutter-action installs from releases_linux.json, which only ever
      # contains x64 archives — there is no Linux arm64 Flutter SDK tarball to
      # download. The engine *does* publish linux-arm64 artifacts, so on arm we
      # clone the SDK at the stable tag and let precache fetch them.
      - name: Install Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch stable \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            libsecret-1-dev libjsoncpp-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            patchelf rpm ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Build Linux bundle
        run: |
          flutter --version
          flutter precache --linux
          flutter pub get
          flutter build linux --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Bundle shared libraries
        run: ./linux/packaging/bundle-libs.sh build/linux/${{ matrix.arch }}/release/bundle

      - name: Create archive
        run: |
          cd build/linux/${{ matrix.arch }}/release/bundle
          tar czf "$GITHUB_WORKSPACE/jellybox-linux-${{ matrix.arch }}.tar.gz" .

      - name: Build AppImage
        run: |
          ./linux/packaging/make-appimage.sh \
            build/linux/${{ matrix.arch }}/release/bundle \
            "$GITHUB_WORKSPACE/jellybox-linux-${{ matrix.appimage_arch }}.AppImage" \
            "${{ needs.version.outputs.version }}"

      - name: Build .deb package
        run: |
          ./linux/packaging/make-deb.sh \
            build/linux/${{ matrix.arch }}/release/bundle \
            "$GITHUB_WORKSPACE/jellybox-linux-${{ matrix.deb_arch }}.deb" \
            "${{ needs.version.outputs.version }}" \
            "${{ needs.version.outputs.build_number }}"

      - name: Build .rpm package
        run: |
          ./linux/packaging/make-rpm.sh \
            build/linux/${{ matrix.arch }}/release/bundle \
            "$GITHUB_WORKSPACE/jellybox-linux-${{ matrix.rpm_arch }}.rpm" \
            "${{ needs.version.outputs.version }}" \
            "${{ needs.version.outputs.build_number }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellybox-linux-${{ matrix.arch }}
          path: |
            jellybox-linux-${{ matrix.arch }}.tar.gz
            jellybox-linux-${{ matrix.appimage_arch }}.AppImage
            jellybox-linux-${{ matrix.deb_arch }}.deb
            jellybox-linux-${{ matrix.rpm_arch }}.rpm

  # Publishing is its own job so the two build legs never race to create or
  # overwrite the same release.
  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_latest)
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jellybox-linux-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist

      # Tag push: create (or update) the release for that tag.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual run with the checkbox ticked: attach to whatever release GitHub
      # currently marks as "Latest". Uses `gh release upload` rather than the
      # release action so only assets are touched — the existing release's
      # title and notes are left exactly as they are.
      - name: Attach to latest release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `|| true` because `set -e` would otherwise abort here when the repo
          # has no published release, skipping the explanatory error below.
          TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            echo "::error::No published release found to attach to. Push a v* tag first, or publish a release manually."
            exit 1
          fi
          echo "Attaching assets to existing release $TAG"
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice::Uploaded Linux artifacts to release $TAG"
