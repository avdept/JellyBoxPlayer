name: Private packages
description: >
  Point upnp_quirks and genre_playlists at their private repositories when the
  matching deploy keys are available. Without a key the build uses the in-repo
  stub for that package, so forks and public clones still build.

inputs:
  deploy-key:
    description: Read-only SSH deploy key for the private upnp_quirks repository
    required: false
    default: ''
  genre-playlists-deploy-key:
    description: Read-only SSH deploy key for the private genre_playlists repository
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Enable the private packages
      shell: bash
      env:
        UPNP_QUIRKS_KEY: ${{ inputs.deploy-key }}
        GENRE_PLAYLISTS_KEY: ${{ inputs.genre-playlists-deploy-key }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.ssh"
        ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
        overrides="$GITHUB_WORKSPACE/pubspec_overrides.yaml"
        rm -f "$overrides"

        enable() {
          local package="$1" key="$2"
          local key_file="$HOME/.ssh/${package}_ci"
          local host="github.com-${package}"
          printf '%s\n' "$key" > "$key_file"
          chmod 600 "$key_file"
          printf 'Host %s\n  HostName github.com\n  User git\n  IdentityFile %s\n  IdentitiesOnly yes\n' \
            "$host" "$key_file" >> "$HOME/.ssh/config"
          git config --global "url.git@${host}:avdept/${package}.git.insteadOf" \
            "git@github.com:avdept/${package}.git"
          [[ -f "$overrides" ]] || echo "dependency_overrides:" > "$overrides"
          printf '  %s:\n    git:\n      url: git@github.com:avdept/%s.git\n      ref: main\n' \
            "$package" "$package" >> "$overrides"
          echo "${package}: private package"
        }

        if [[ -n "$UPNP_QUIRKS_KEY" ]]; then
          enable upnp_quirks "$UPNP_QUIRKS_KEY"
        else
          echo "upnp_quirks: in-repo stub, no rule table"
        fi
        if [[ -n "$GENRE_PLAYLISTS_KEY" ]]; then
          enable genre_playlists "$GENRE_PLAYLISTS_KEY"
        else
          echo "genre_playlists: in-repo stub, no generator"
        fi
