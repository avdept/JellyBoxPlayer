app-id: com.prodigytech.jellybox
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: jellybox

# The bundle already carries every library it needs (bundle-libs.sh), with
# rpaths rewritten to $ORIGIN; the runtime only supplies glibc, GL and
# Wayland. eu-strip must not touch those bundled objects.
build-options:
  no-debuginfo: true

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # flutter_secure_storage keeps the server token in the keyring via libsecret.
  - --talk-name=org.freedesktop.secrets
  # connectivity_plus watches interface changes via NetworkManager on the system bus.
  - --system-talk-name=org.freedesktop.NetworkManager
  # audio_service_mpris registers as org.mpris.MediaPlayer2.<channel id>.instance<pid>.
  - --own-name=org.mpris.MediaPlayer2.com.ryanheise.bg_demo.channel.audio.*
  # Discord rich presence: native Discord's socket and the Flatpak Discord ones.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/com.discordapp.DiscordCanary:create
  - --filesystem=xdg-run/app/com.discordapp.DiscordPTB:create

modules:
  - name: jellybox
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/jellybox
      - cp -a bundle/. /app/lib/jellybox/
      - install -Dm755 jellybox /app/bin/jellybox
      - install -Dm644 com.prodigytech.jellybox.desktop -t /app/share/applications
      - install -Dm644 com.prodigytech.jellybox.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 com.prodigytech.jellybox.metainfo.xml -t /app/share/metainfo
    sources:
      # Populated by stage.sh from a finished `flutter build linux` bundle.
      - type: dir
        path: stage
